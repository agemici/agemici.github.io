<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birim Dönüştürücü</title>
    <style>
        body {
            /* Koyu yeşil ve orman yeşili tonlarında degrade */
            background: linear-gradient(135deg, #0a3a1f 0%, #115e33 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #115e33;
            margin-top: 0;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: 0.3s;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
        }
        input:focus, select:focus {
            border-color: #115e33;
            background-color: #fff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #0a3a1f, #115e33);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: linear-gradient(to right, #198754, #20c997);
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 10px rgba(32, 201, 151, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Birim Dönüştürücü</h2>
        
        <label>Değer Giriniz:</label>
        <input type="number" id="deger" value="50">

        <label>Dönüşüm Tipi:</label>
        <select id="donusumTipi">
            <option value="c_to_f">Celsius -> Fahrenheit</option>
            <option value="m_to_km">Metre -> Kilometre</option>
            <option value="kg_to_g">Kilogram -> Gram</option>
        </select>

        <button onclick="birimDonustur()">Hesapla</button>

        <div id="sonucAlani" class="result-box">
            Sonuç: <span id="sonucDeger"></span>
        </div>
    </div>

    <script>
        function birimDonustur() {
            const deger = parseFloat(document.getElementById('deger').value);
            const tip = document.getElementById('donusumTipi').value;

            if (isNaN(deger)) {
                alert("Lütfen geçerli bir sayı giriniz.");
                return;
            }

            let sonuc = 0;
            let formatliSonuc = "";

            if (tip === "c_to_f") {
                sonuc = (deger * 1.8) + 32;
                formatliSonuc = sonuc.toString() + " °F"; 
            } else if (tip === "m_to_km") {
                sonuc = deger / 1000;
                formatliSonuc = sonuc.toString() + " km";
            } else if (tip === "kg_to_g") {
                sonuc = deger * 1000;
                formatliSonuc = sonuc.toLocaleString('tr-TR') + " g";
            }

            document.getElementById('sonucDeger').innerText = formatliSonuc;
            document.getElementById('sonucAlani').style.display = "block";
        }
    </script>
</body>
</html>
